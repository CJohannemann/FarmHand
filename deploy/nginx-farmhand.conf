# FarmHand — static site, no backend to proxy to.
#
# One-time setup on the VPS:
#   sudo cp deploy/nginx-farmhand.conf /etc/nginx/sites-available/farmhand
#   sudo ln -s /etc/nginx/sites-available/farmhand /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
#   sudo certbot --nginx -d farmhand.independencebaseballclub.com
#
# certbot rewrites this file in place to add the certificate and an
# http -> https redirect — the block below is deliberately http-only.

server {
    listen 80;
    listen [::]:80;
    server_name farmhand.independencebaseballclub.com;

    root /var/www/farmhand;
    index index.html;

    # The client router's own paths (see src/lib/route.ts). Each is a real,
    # refreshable, shareable URL that serves the app shell with a 200.
    # Listed explicitly rather than falling everything back to index.html,
    # so that a URL which is NOT one of these can be answered honestly
    # below. Keep in step with route.ts's ROUTES.
    location = / {
        try_files /index.html =404;
    }
    location ~ ^/(app|login|signup)/?$ {
        try_files /index.html =404;
    }

    # Anything else: a real file if one exists (assets, wasm, icons),
    # otherwise genuinely not here. error_page hands back the app shell so
    # the in-app 404 screen still renders — but with no `=` on that
    # directive nginx keeps the 404 status rather than rewriting it to 200,
    # so a crawler, an uptime check, or a broken link in someone's email
    # sees a real "not found" instead of a page insisting it is fine.
    location / {
        try_files $uri =404;
    }

    error_page 404 /index.html;

    # Most nginx installs already map .wasm -> application/wasm, but this
    # covers a system whose mime.types predates that — PGlite's local
    # database is a ~8MB WASM Postgres build and needs the right type to
    # load as WebAssembly rather than as an opaque download.
    location ~ \.wasm$ {
        default_type application/wasm;
    }

    # Build output is content-hashed (index-abc123.js), so it's safe to
    # cache hard; index.html itself is not touched by this rule.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
    }
}

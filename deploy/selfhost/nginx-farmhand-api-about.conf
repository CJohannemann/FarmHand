# What https://api.farmhandmanager.com/ itself shows: one plain page saying
# what this address is. Before this it was nginx's bare "404 Not Found",
# which gives a corporate web filter nothing to classify, so the address
# stays "uncategorized" and gets isolated or blocked on work networks —
# separately from farmhandmanager.com, and it is the address the app signs
# in and syncs through. The same fix as the description in index.html.
#
# Only the exact root: /rest/v1/, /auth/v1/ and /verify are untouched.
#
# Included from the HTTPS server block of
# /etc/nginx/sites-available/farmhand-api (see deploy/selfhost/README.md),
# so a change here goes live with git pull and an nginx reload.
location = / {
    default_type text/html;
    add_header Cache-Control "public, max-age=86400";
    return 200 '<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Farm Hand Manager - sign-in and data service</title>
<meta name="description" content="The sign-in and data service for Farm Hand Manager (farmhandmanager.com), farm record keeping for livestock, crops, feed, costs and receipts.">
</head>
<body style="font-family: system-ui, sans-serif; max-width: 36rem; margin: 3rem auto; padding: 0 1rem; line-height: 1.5; color: #1f2a1f">
<h1 style="color: #3f7d3f">Farm Hand Manager</h1>
<p>This address is the sign-in and data service for <a href="https://farmhandmanager.com/">Farm Hand Manager</a>, a record-keeping app for farms: livestock, crops, feed, costs and receipts.</p>
<p>There is nothing to see here directly. The app at <a href="https://farmhandmanager.com/">farmhandmanager.com</a> uses it in the background to sign people in and keep a farm&#39;s records in step across its phones.</p>
</body>
</html>
';
}

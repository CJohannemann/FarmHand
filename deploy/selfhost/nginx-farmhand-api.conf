# FarmHand's self-hosted backend (PostgREST + GoTrue), fronted here instead
# of by Kong — this is the one piece Kong would normally own (routing +
# CORS), trimmed down since nothing here needs Kong's rate limiting or
# per-consumer apikey validation for a single-tenant personal instance.
#
# One-time setup on the VPS:
#   sudo cp deploy/selfhost/nginx-farmhand-api.conf /etc/nginx/sites-available/farmhand-api
#   sudo ln -s /etc/nginx/sites-available/farmhand-api /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
#   sudo certbot --nginx -d api.independencebaseballclub.com
#
# certbot rewrites this file in place to add the certificate and an
# http -> https redirect — the block below is deliberately http-only.
#
# CORS lives inside each location rather than at the server level: nginx
# only allows add_header inside an `if` when that `if` is itself nested in
# a location block, not when it's directly in `server`.
#
# Only the `if ($request_method = OPTIONS)` block sets CORS headers — the
# proxied (non-OPTIONS) path deliberately does NOT, because both PostgREST
# and GoTrue already send their own complete set on every response they
# give, regardless of status code. An earlier version of this file added a
# second copy at the location level for the proxied path "to be safe";
# that was the actual bug behind a run of "the server clearly did the
# thing, but the browser says it couldn't reach the server" reports —
# Safari (and Chrome, per the Fetch spec) rejects a response outright when
# a CORS header appears twice, which is indistinguishable from a real
# network failure to whoever's using the app. Confirmed directly: a plain
# curl against a live 200 response showed Access-Control-Allow-Origin
# twice, with two different values (PostgREST's own `*` and this file's
# specific origin).
#
# The Access-Control-Allow-Headers list must cover every header supabase-js
# actually sends, and that list is longer than it looks. postgrest-js sets
# `Accept-Profile` on GET/HEAD and `Content-Profile` on everything else —
# unconditionally, whenever a schema is configured, which it is by default
# ('public'). Both were missing here for a long time, and the result was
# that EVERY PostgREST call from the browser died at preflight while
# sign-in (GoTrue, which sends neither) kept working perfectly: the app
# looked fine, stayed usable on local data, and silently never synced a
# single row — the remote database had zero farms in it. It is invisible
# from the server side, because a preflight rejection is the browser
# refusing to send the real request at all: nginx logs nothing unusual,
# PostgREST never sees it, and curl (which does not implement CORS) sails
# through every reproduction attempt. In the app it surfaces only as a bare
# "TypeError: Load failed" / "Failed to fetch" with status 0 and an empty
# console, since the browser deliberately withholds the reason from page
# JavaScript. Confirmed by direct A/B: the same request succeeds (200/400)
# without the profile header and throws "Failed to fetch" with it.
#
# Do not reintroduce a location-level copy without re-reading this. If a
# future backend ever stops sending its own CORS headers, the fix is to
# hide *its* header (`proxy_hide_header Access-Control-Allow-Origin;`)
# before adding nginx's own, not to add a second `add_header` alongside an
# existing one — and even then, marking it `always` reopens the *other*
# half of this same class of bug for the `if` block above: `always` was
# tried once already and verified (against a real nginx + mock backend,
# not just `nginx -t`) to apply the location-level headers to the if
# block's `return 204` too, ON TOP OF that block's own copies, producing
# the identical double-header problem on the OPTIONS path instead.

server {
    listen 80;
    listen [::]:80;
    server_name api.independencebaseballclub.com;

    # supabase-js's preflight and actual requests both need these; without
    # them every write from the browser fails at the CORS step before it
    # ever reaches PostgREST or GoTrue.
    set $cors_origin "https://farmhand.independencebaseballclub.com";

    # PostgREST expects its own root ("/asset"), not "/rest/v1/asset") —
    # the /rest/v1 prefix is a Supabase-client convention, not something
    # PostgREST itself knows about.
    location /rest/v1/ {
        # No add_header here for the proxied (non-OPTIONS) path, on purpose:
        # PostgREST already sends its own complete, correct CORS headers on
        # every response regardless of status (verified directly — a plain
        # curl against a live 200 response showed Access-Control-Allow-Origin
        # *twice*, PostgREST's own plus this line's, with two different
        # values). Safari (and Chrome, per the Fetch spec) rejects a response
        # with a duplicated header outright — the browser reports a generic
        # network failure ("Load failed") even though the request succeeded
        # and PostgREST answered correctly, which is exactly what that looks
        # like from the user's side: an action that plainly worked on the
        # server being reported back as "could not reach the server". Only
        # the OPTIONS branch below still sets these — preflight has no
        # backend response to duplicate against, and this location's `if`
        # already has real, tested history behind it (see the file header).
        if ($request_method = OPTIONS) {
            add_header Access-Control-Allow-Origin $cors_origin;
            add_header Access-Control-Allow-Methods "GET, POST, PATCH, DELETE, PUT, OPTIONS, HEAD";
            add_header Access-Control-Allow-Headers "authorization, apikey, content-type, accept-profile, content-profile, prefer, x-client-info, x-supabase-api-version, range";
            add_header Access-Control-Max-Age 3600;
            add_header Content-Length 0;
            add_header Content-Type text/plain;
            return 204;
        }

        rewrite ^/rest/v1/(.*)$ /$1 break;
        proxy_pass http://127.0.0.1:8001;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Fail fast rather than hang, so a wedged backend surfaces as a 504
        # the app can report instead of a request that never answers. Read is
        # the looser of the two here: a first sync pull on a farm with years
        # of records is legitimately slow, and cutting it off is worse than
        # waiting.
        proxy_connect_timeout 10s;
        proxy_send_timeout 30s;
        proxy_read_timeout 30s;
    }

    # Same story for GoTrue: its routes are /token, /signup, /recover, etc,
    # not /auth/v1/token.
    location /auth/v1/ {
        # Same fix, same reason as /rest/v1/ above: GoTrue already sends its
        # own Access-Control-Allow-Origin (and friends) on every response —
        # this is what turned a genuinely successful sign-in (200, a real
        # session issued — confirmed in GoTrue's own logs) into the browser
        # reporting "Load failed" / "could not reach the server", because the
        # response nginx was about to hand back carried the header twice.
        if ($request_method = OPTIONS) {
            add_header Access-Control-Allow-Origin $cors_origin;
            add_header Access-Control-Allow-Methods "GET, POST, PATCH, DELETE, PUT, OPTIONS, HEAD";
            add_header Access-Control-Allow-Headers "authorization, apikey, content-type, accept-profile, content-profile, prefer, x-client-info, x-supabase-api-version, range";
            add_header Access-Control-Max-Age 3600;
            add_header Content-Length 0;
            add_header Content-Type text/plain;
            return 204;
        }

        rewrite ^/auth/v1/(.*)$ /$1 break;
        proxy_pass http://127.0.0.1:9999;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Fail fast rather than hang. GoTrue sends mail synchronously inside
        # /recover and /signup, so an SMTP host it cannot reach becomes a
        # request that never answers — and nginx's 60s default leaves the
        # browser dangling that whole time before reporting a bare "Load
        # failed" with nothing to act on. A 504 at 15s is diagnosable.
        proxy_connect_timeout 10s;
        proxy_send_timeout 15s;
        proxy_read_timeout 15s;
    }
}

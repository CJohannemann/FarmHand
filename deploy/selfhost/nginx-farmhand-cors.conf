# Which browser origins the FarmHand API answers CORS preflights for.
#
# One-time setup on the VPS:
#   sudo cp deploy/selfhost/nginx-farmhand-cors.conf /etc/nginx/conf.d/farmhand-cors.conf
#   sudo nginx -t && sudo systemctl reload nginx
#
# This lives in conf.d/ rather than inside nginx-farmhand-api.conf for two
# reasons: `map` is only valid at the http level, not inside a `server`
# block, and certbot rewrites the api config in place — anything it does
# not recognise there is at the mercy of that. conf.d/*.conf is included
# ahead of sites-enabled/* by Ubuntu's stock nginx.conf, so $cors_origin
# is defined by the time the server blocks reference it.
#
# A map rather than a plain `set` because the apex, www and the dev site
# are separate origins as far as a browser is concerned, and a `set` can
# only name one.
#
# The dev site (dev.farmhandmanager.com, see ../README.md) shares this one
# backend, so it needs listing here too. Leaving it out does not fail as a
# CORS error in the app: the preflight comes back naming the apex origin,
# the browser refuses the mismatch without telling page JavaScript why, and
# supabase-js reports the same "Load failed" every other blocked preflight
# produces -- which the sign-in screen then words as the server never
# answering. Exactly the class of bug the api config's header warns about,
# reached from the other end.
# An origin that is not listed falls through to `default`, which then does
# not match what the caller sent — so the browser refuses the response,
# which is the correct outcome for an origin we do not serve.
#
# Only the OPTIONS preflight in nginx-farmhand-api.conf uses this;
# PostgREST and GoTrue send their own CORS headers on real responses, and
# adding a second copy there is a bug with a long history — see that
# file's header before changing anything here.
map $http_origin $cors_origin {
    default                              "https://farmhandmanager.com";
    "https://farmhandmanager.com"        "https://farmhandmanager.com";
    "https://www.farmhandmanager.com"    "https://www.farmhandmanager.com";
    "https://dev.farmhandmanager.com"    "https://dev.farmhandmanager.com";
}
